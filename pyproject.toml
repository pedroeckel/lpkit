[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lpkit"
version = "0.2.1"
description = "Ferramenta para visualização gráfica e resolução de modelos de Programação Linear em duas variáveis, incluindo simplex e zona viável."
readme = "README.md"
license = "MIT"

authors = [
    { name = "Pedro Eckel", email = "contato@pedroeckel.com" }
]

requires-python = ">=3.8"

dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.5",
    "sympy>=1.10",
]

keywords = [
    "linear-programming",
    "optimization",
    "simplex",
    "operations-research",
    "mathematical-optimization",
    "visualization",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/pedroeckel/lpkit"
Repository = "https://github.com/pedroeckel/lpkit"
Issues = "https://github.com/pedroeckel/lpkit/issues"

[tool.setuptools.packages.find]
where = ["."]